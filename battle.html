<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPBL 棒球數學對戰聯盟</title>
    <link rel="stylesheet" href="style.css"> 
    <link rel="stylesheet" href="battle.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body class="battle-bg">

    <div id="login-screen" class="glass-panel login-box">
        <h1 class="glow-text-red">⚾ 數學對戰聯盟</h1>
        <input type="text" id="login-username" placeholder="輸入玩家名稱" class="battle-input text-center">
        <button id="btn-login" class="battle-btn primary-btn">進入競技場</button>
    </div>

    <div id="main-battle-app" style="display: none; width: 100%; max-width: 1200px; margin: 0 auto;">
        
        <header class="battle-header" style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #444; padding-bottom: 10px; margin-bottom: 20px;">
            <h2 style="margin: 0;">CPBL 競技場 <span id="current-user-display" class="user-badge" style="font-size: 0.6em; background: #333; padding: 5px 10px; border-radius: 10px; margin-left: 10px;"></span></h2>
            <button id="btn-leave-room" class="battle-btn delete-btn" style="width: auto; margin: 0; padding: 8px 15px; font-size: 1em; display: none;">🚪 離開房間</button>
        </header>

        <div id="lobby-view" class="lobby-layout" style="display: none;">
            <div class="glass-panel lobby-left">
                <h3 class="glow-text-gold" style="margin-top: 0;">🃏 我的球員圖鑑</h3>
                <div class="filters-row">
                    <select id="lobby-filter-team" class="battle-select">
                        <option value="all">所有球隊</option>
                        <option value="Brothers">中信兄弟</option>
                        <option value="Lions">統一7-ELEVEn獅</option>
                        <option value="Monkeys">樂天桃猿</option>
                        <option value="Guardians">富邦悍將</option>
                        <option value="Dragons">味全龍</option>
                        <option value="Hawks">台鋼雄鷹</option>
                    </select>
                    <select id="lobby-filter-role" class="battle-select">
                        <option value="all">所有定位</option>
                        <option value="Batter">打者 (Batter)</option>
                        <option value="Pitcher">投手 (Pitcher)</option>
                    </select>
                </div>
                <div class="card-collection-grid scrollable-grid" id="lobby-card-grid"></div>
            </div>

            <div class="glass-panel lobby-right">
                <h3 class="glow-text-red" style="margin-top: 0;">🏟️ 賽事管理中心</h3>
                <div class="mode-box" style="margin-bottom: 15px;">
                    <label style="display: block; margin-bottom: 5px; color: #ccc;">選擇遊玩方式：</label>
                    <select id="game-mode" class="battle-select">
                        <option value="basic">基礎對決 (數值比大小)</option>
                        <option value="dice">骰子決戰 (數值 ÷ 骰子)</option>
                    </select>
                </div>
                <button id="btn-create-room" class="battle-btn create-btn">創建公開房間</button>
                
                <div class="divider"><span>線上公開房間列表</span></div>
                <div id="room-list" class="scrollable-list">
                    <p style="color: #888; font-style: italic;">目前沒有人在開房...</p>
                </div>

                <div class="divider"><span>手動代碼輸入</span></div>
                <div class="join-room-box">
                    <input type="text" id="join-room-id" placeholder="輸入 4 位數房間碼" class="battle-input text-center" style="margin: 0; margin-bottom: 10px;">
                    <button id="btn-join-room" class="battle-btn join-btn">加入</button>
                </div>
                <p id="lobby-message" class="error-msg" style="color: #FF4136; font-weight: bold; margin-top: 10px;"></p>
            </div>
        </div>

        <div id="deck-building-view" class="glass-panel" style="display: none;">
            <div class="deck-header-row" style="margin-bottom: 15px;">
                <div>
                    <span class="room-pill" style="background: #222; padding: 5px 12px; border-radius: 15px; border: 1px solid #555;">房間：<span id="draft-room-id" class="glow-text-gold"></span></span>
                    <span class="room-pill" style="background: #222; padding: 5px 12px; border-radius: 15px; border: 1px solid #555;">模式：<span id="draft-room-mode"></span></span>
                </div>
            </div>

            <div class="deck-main-layout" style="display: flex; gap: 25px;">
                <div class="deck-left" style="flex: 2;">
                    <div class="filters-row" style="margin-bottom: 15px; display: flex; gap: 15px;">
                        <select id="deck-filter-team" class="battle-select">
                            <option value="all">所有球隊</option>
                            <option value="Brothers">中信兄弟</option>
                            <option value="Lions">統一獅</option>
                            <option value="Monkeys">樂天桃猿</option>
                            <option value="Guardians">富邦悍將</option>
                            <option value="Dragons">味全龍</option>
                            <option value="Hawks">台鋼雄鷹</option>
                        </select>
                        <select id="deck-filter-role" class="battle-select">
                            <option value="all">所有定位</option>
                            <option value="Batter">打者</option>
                            <option value="Pitcher">投手</option>
                        </select>
                    </div>
                    <div class="card-collection-grid scrollable-grid" id="deck-selection-grid" style="max-height: 450px;"></div>
                </div>

                <div class="deck-right-panel" style="flex: 1; background: rgba(0,0,0,0.4); padding: 20px; border-radius: 10px; border: 1px dashed #555;">
                    <h3 class="glow-text-gold" style="margin-top: 0; text-align: center;">先發名單驗證</h3>
                    <div class="deck-status-box" style="display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px;">
                        <div style="font-size: 1.2em; font-weight: bold; text-align: center;">已選卡牌：<span id="deck-count" style="color:#FFD700;">0</span> / 5</div>
                        <div class="status-pill req-badge" id="req-pitcher" style="padding: 8px; text-align: center; border-radius: 6px;">投手 (0/2)</div>
                        <div class="status-pill req-badge" id="req-batter" style="padding: 8px; text-align: center; border-radius: 6px;">打者 (0/2)</div>
                    </div>
                    
                    <button id="btn-ready" class="battle-btn ready-btn" disabled>確認先發陣容</button>
                    
                    <div class="sync-status-box" style="margin-top: 20px; text-align: center;">
                        <p id="p1-status-text" style="color: #aaa; margin: 5px 0;">房主：選牌中...</p>
                        <p id="p2-status-text" style="color: #aaa; margin: 5px 0;">對手：等待加入...</p>
                        <button id="btn-start-game" class="battle-btn primary-btn" style="display: none; margin-top: 15px; box-shadow: 0 0 15px green;">🔥 雙方就緒，開始遊戲！</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="battlefield-view" class="glass-panel arena-bg" style="display: none;">
            <div style="text-align: center; font-size: 1.2em; margin-bottom: 15px;">房間號碼：<span id="display-room-id" class="glow-text-gold"></span></div>

            <div class="opponent-area" style="border-bottom: 1px solid #444; padding-bottom: 15px;">
                <h3 style="color: white; display: flex; justify-content: space-between; margin: 0 0 10px 0;">對手：<span id="opponent-name">連線中...</span> <span style="background: #FF4136; padding: 2px 10px; border-radius: 10px; font-size: 0.8em;">得分: <span id="opponent-score">0</span></span></h3>
                <div class="battle-hand" id="opponent-hand" style="display: flex; justify-content: center; gap: 15px; min-height: 160px;"></div>
            </div>

            <div class="clash-area" style="min-height: 140px; display: flex; justify-content: center; align-items: center; flex-direction: column; background: rgba(0,0,0,0.7); border-radius: 10px; margin: 20px 0; border: 1px solid #444;">
                <h2 id="battle-status" class="glow-text-gold" style="font-size: 1.6em; margin: 0;">等待雙方出牌...</h2>
            </div>

            <div class="player-area">
                <h3 style="color: white; display: flex; justify-content: space-between; margin: 0 0 10px 0;">我方：<span id="my-name-display"></span> <span style="background: #FF4136; padding: 2px 10px; border-radius: 10px; font-size: 0.8em;">得分: <span id="player-score">0</span></span></h3>
                <div class="battle-hand" id="player-hand" style="display: flex; justify-content: center; gap: 15px; min-height: 160px;"></div>
            </div>
        </div>
    </div>

    <div id="math-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content math-box">
            <h2 class="glow-text-red" style="margin-top: 0;">🔥 戰術挑戰！</h2>
            <p style="color: white;">答對題目，卡片戰力 <b style="color: #FFD700; font-size: 1.2em;">+20</b>！</p>
            <h1 id="math-question" class="math-q"></h1>
            <input type="number" id="math-answer" placeholder="輸入 x 的值" class="battle-input text-center math-input" style="width: 80%;">
            <button id="btn-submit-math" class="battle-btn submit-btn" style="background: #FFD700; color: #000;">送出答案</button>
            <p id="math-feedback" class="math-fb" style="font-weight: bold; font-size: 1.3em; margin-top: 15px;"></p>
        </div>
    </div>

    <script src="battle.js"></script>
</body>
</html>
