<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPBL 棒球數學對戰聯盟</title>
    <link rel="stylesheet" href="style.css"> 
    <link rel="stylesheet" href="battle.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body class="battle-bg">

    <div id="login-screen" class="glass-panel login-box">
        <h1 class="glow-text-red">⚾ 數學對戰聯盟</h1>
        <input type="text" id="login-username" placeholder="輸入玩家名稱" class="battle-input">
        <button id="btn-login" class="battle-btn primary-btn">進入競技場</button>
    </div>

    <div id="main-battle-app" style="display: none; width: 100%; max-width: 1200px; margin: 0 auto;">
        
        <header class="battle-header">
            <h2>CPBL 競技場 <span id="current-user-display" class="user-badge"></span></h2>
        </header>

        <div id="lobby-view" class="glass-panel" style="max-width: 500px; margin: 50px auto; text-align: center;">
            <h3 style="color: white;">尋找對手</h3>
            <button id="btn-create-room" class="battle-btn create-btn">建立新房間</button>
            <div class="divider"><span>或</span></div>
            <div class="join-room-box">
                <input type="text" id="join-room-id" placeholder="輸入 4 位數房間號碼" class="battle-input text-center">
                <button id="btn-join-room" class="battle-btn join-btn">加入房間</button>
            </div>
            <p id="lobby-message" class="error-msg"></p>
        </div>

<div id="deck-building-view" class="glass-panel" style="display: none; margin-top: 20px;">
            
            <h3 style="text-align: center; color: white;">房間號碼：<span id="draft-room-id" class="glow-text-gold" style="font-size: 1.5em;"></span></h3>
            
            <div class="deck-header">
                <h2 class="glow-text-gold">挑選 5 名先發球員！</h2>
                <div class="deck-status">
                    <span class="status-pill">已選：<span id="deck-count">0</span> / 5</span>
                    <span class="status-pill req-badge" id="req-pitcher">投手 (0/2)</span>
                    <span class="status-pill req-badge" id="req-batter">打者 (0/2)</span>
                </div>
                <button id="btn-ready" class="battle-btn ready-btn" disabled>準備完成 (等待選牌)</button>
                <p id="waiting-msg" style="color: #FFD700; display: none; margin-top: 10px;">已準備！等待對手...</p>
            </div>
            
            <div class="card-collection-grid" id="deck-selection-grid" style="max-height: 500px; overflow-y: auto; padding: 20px; background: rgba(0,0,0,0.5); border-radius: 10px;">
                </div>
        </div>

        <div id="battlefield-view" class="glass-panel arena-bg" style="display: none; margin-top: 20px;">
            
            <div class="room-info">房間號碼：<span id="display-room-id" class="glow-text-gold"></span></div>

            <div class="opponent-area">
                <h3 class="player-title">對手：<span id="opponent-name">等待中...</span> <span class="score-badge">得分: <span id="opponent-score">0</span></span></h3>
                <div class="battle-hand" id="opponent-hand"></div>
            </div>

            <div class="clash-area">
                <h2 id="battle-status" class="glow-text-gold clash-text">等待雙方準備...</h2>
            </div>

            <div class="player-area">
                <h3 class="player-title">我方：<span id="my-name-display"></span> <span class="score-badge">得分: <span id="player-score">0</span></span></h3>
                <div class="battle-hand" id="player-hand"></div>
            </div>
        </div>
    </div>

    <div id="math-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content math-box">
            <h2 class="glow-text-red" style="margin-top: 0;">🔥 戰術挑戰！</h2>
            <p>答對題目，卡片戰力 <b style="color: #FFD700; font-size: 1.2em;">+20</b>！</p>
            <h1 id="math-question" class="math-q"></h1>
            <input type="number" id="math-answer" placeholder="輸入 x 的值" class="battle-input text-center math-input">
            <button id="btn-submit-math" class="battle-btn submit-btn">送出答案</button>
            <p id="math-feedback" class="math-fb"></p>
        </div>
    </div>

    <script src="battle.js"></script>
</body>
</html>
